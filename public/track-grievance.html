<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track a grievance | CivicResolve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <header class="site-header"><nav class="navbar navbar-expand-lg container" aria-label="Main navigation"><a class="navbar-brand brand" href="/">Civic<span>Resolve</span></a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-3"><a class="nav-link" href="/">Home</a><a class="nav-link" href="/submit-grievance.html">Submit grievance</a><a class="nav-link active" href="/track-grievance.html">Track grievance</a><a class="nav-link" href="/register.html">Register</a><a class="btn btn-outline-primary btn-sm px-3" href="/login.html">Sign in</a></div></div></nav></header>
  <main class="page-wrap container">
    <div class="page-intro"><span class="eyebrow">Progress updates</span><h1>Track your grievance</h1><p>Enter the complaint ID you received when submitting your grievance.</p></div>
    <section class="form-panel track-panel">
      <form id="track-form" class="track-form" novalidate><div class="flex-grow-1"><label class="form-label" for="complaintId">Complaint ID</label><input class="form-control form-control-lg" id="complaintId" name="complaintId" required maxlength="20" placeholder="GRV-0123456789ABCDEF" autocomplete="off"></div><button class="btn btn-primary btn-lg" id="track-button" type="submit">Find grievance</button></form>
      <div id="track-message" class="alert d-none mt-4" role="status" aria-live="polite"></div>
      <article id="track-result" class="track-result d-none" aria-live="polite"></article>
    </section>
  </main>
  <footer class="site-footer"><div class="container d-flex justify-content-between"><span>Smart Grievance Management System</span><a href="/">Back to home</a></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/track.js"></script>
</body>
</html>
