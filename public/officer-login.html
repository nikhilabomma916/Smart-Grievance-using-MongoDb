<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Officer sign in | CivicResolve</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet"></head>
<body>
  <header class="site-header"><nav class="navbar container" aria-label="Main navigation"><a class="navbar-brand brand" href="/">Civic<span>Resolve</span></a><a class="nav-link" href="/">Return to public portal</a></nav></header>
  <main class="page-wrap container login-wrap"><div class="page-intro"><span class="eyebrow">Authorized access</span><h1>Officer sign in</h1><p>Sign in to review, assign, and update public grievances.</p></div>
    <section class="form-panel login-panel"><div id="login-message" class="alert d-none" role="alert"></div><form id="login-form" novalidate><div class="mb-3"><label class="form-label" for="email">Officer email</label><input class="form-control form-control-lg" type="email" id="email" name="email" required autocomplete="username"><div class="invalid-feedback">Enter your officer email.</div></div><div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control form-control-lg" type="password" id="password" name="password" required autocomplete="current-password"><div class="invalid-feedback">Enter your password.</div></div><button class="btn btn-primary btn-lg w-100" id="login-button" type="submit">Sign in</button></form><p class="form-hint mt-3 mb-0">Access is limited to the configured officer account.</p></section>
  </main><footer class="site-footer"><div class="container">Smart Grievance Management System</div></footer><script src="/js/login.js"></script>
</body></html>
